name: Driftline v0.4.1 Runtime Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/driftline-v041-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNTIME_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-10c4-8230-a6de-ba1b616b3f8a/raw?se=2026-08-08T05%3A48%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=a1c56247-c612-59df-b30c-af7bbbe92d34&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T02%3A07%3A11Z&ske=2026-08-09T02%3A07%3A11Z&sks=b&skv=2026-02-06&sig=J7HDoHBnwd65k7wei15Fz48JZ31Ac0ABGajgfBV843w%3D'
  RUNTIME_SHA256: 9e140dc7b6a3b122d8dd53bf56fbcb5b04eeb6643ad26647f6afb7acd42cd973
  APP_PACKAGE: com.kuschi.driftline.echoes
  MAIN_ACTIVITY: com.kuschi.driftline.MainActivity

jobs:
  api35-smoke:
    name: API 35 install, launch, instrumentation, and relaunch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download and verify runtime APK bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime /tmp/smoke-evidence
          curl --fail --location --retry 5 --retry-all-errors "$RUNTIME_URL" -o /tmp/runtime.zip
          echo "$RUNTIME_SHA256  /tmp/runtime.zip" | sha256sum --check --strict
          unzip -q /tmp/runtime.zip -d /tmp/runtime
          test -s /tmp/runtime/Driftline-Echoes-at-0317-v0.4.1.apk
          test -s /tmp/runtime/Driftline-Echoes-at-0317-v0.4.1-androidTest.apk

      - name: Boot emulator and run runtime smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: echo '...