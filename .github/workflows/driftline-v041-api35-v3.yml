name: Driftline v0.4.1 API 35 E2E v3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/driftline-v041-api35-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNTIME_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-57dc-81fa-90c9-4fbcd1a57cc6/raw?se=2026-08-08T05%3A33%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=a62795e5-3044-59e2-a864-72b889f09882&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T03%3A53%3A08Z&ske=2026-08-09T03%3A53%3A08Z&sks=b&skv=2026-02-06&sig=pznslw7mF6u5xR4A8pWg1CFHkPlT0Iy4uxlJ55DSgWw%3D'
  RUNTIME_SHA256: 9e140dc7b6a3b122d8dd53bf56fbcb5b04eeb6643ad26647f6afb7acd42cd973
  APP_PACKAGE: com.kuschi.driftline.echoes
  MAIN_ACTIVITY: com.kuschi.driftline.MainActivity

jobs:
  api35-e2e:
    name: API 35 full installed-app E2E
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Download and verify runtime APK bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime /tmp/api35-evidence
          curl --fail --location --retry 5 --retry-all-errors "$RUNTIME_URL" -o /tmp/runtime.zip
          echo "$RUNTIME_SHA256  /tmp/runtime.zip" | sha256sum --check --strict
          unzip -q /tmp/runtime.zip -d /tmp/runtime
          find /tmp/runtime -maxdepth 2 -type f -printf '%p %s bytes\n' | tee /tmp/api35-evidence/runtime-files.txt
          test -s /tmp/runtime/Driftline-Echoes-at-0317-v0.4.1.apk
          test -s /tmp/runtime/Driftline-Echoes-at-0317-v0.4.1-androidTest.apk

      - name: Boot API 35, install APKs, and execute full E2E suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: echo '' | base64 -d > /tmp/driftline-api35.sh && bash /tmp/driftline-api35.sh

      - name: Upload API 35 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftline-v041-api35-e2e-v3
          path: /tmp/api35-evidence
          if-no-files-found: warn
          retention-days: 7
