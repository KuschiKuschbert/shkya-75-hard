name: Driftline v0.4.1 API 26 Final Runtime Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/driftline-v041-api26-final.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNTIME_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-7474-81fa-9b4e-1d5ec1b54069/raw?se=2026-08-08T05%3A57%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=c41e61b6-37f6-5e01-a082-3cc9824f1eb0&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T01%3A48%3A05Z&ske=2026-08-09T01%3A48%3A05Z&sks=b&skv=2026-02-06&sig=/F7dxFfrhIVMlVz/cvXAV8/Q5zpBvvkyx4BeuIIbAtE%3D'
  RUNTIME_SHA256: 9e140dc7b6a3b122d8dd53bf56fbcb5b04eeb6643ad26647f6afb7acd42cd973
  APP_PACKAGE: com.kuschi.driftline.echoes
  MAIN_ACTIVITY: com.kuschi.driftline.MainActivity

jobs:
  api26-runtime:
    name: API 26 install, launch, mechanics, lifecycle, and relaunch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and verify runtime APK bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime /tmp/api26-final-evidence
          curl --fail --location --retry 5 --retry-all-errors "$RUNTIME_URL" -o /tmp/runtime.zip
          echo "$RUNTIME_SHA256  /tmp/runtime.zip" | sha256sum --check --strict
          unzip -q /tmp/runtime.zip -d /tmp/runtime
          test -s /tmp/runtime/Driftline-Echoes-at-0317-v0.4.1.apk
          test -s /tmp/runtime/Driftline-Echoes-at-0317-v0.4.1-androidTest.apk

      - name: Boot Android 8 emulator and execute installed-app tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: echo '' | base64 -d > /tmp/driftline-api26-final.sh && bash /tmp/driftline-api26-final.sh

      - name: Upload API 26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftline-v041-api26-final-evidence
          path: /tmp/api26-final-evidence
          if-no-files-found: warn
          retention-days: 7
